name: Backend CI

on:
  push:
    branches:
      - main
      - ci-cd/day3-ci
      - ci-cd/day4-artifacts

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  backend-ci:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::YOUR_ACCOUNT_ID:role/GitHubActionsECRPushRole
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/food-backend:${{ github.sha }} \
            -t food-backend:ci .
        working-directory: .

      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/food-backend:${{ github.sha }}

      - name: Create Docker image archive
        run: docker save food-backend:ci -o backend/food-backend.tar
        working-directory: .

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: food-backend-image
          path: backend/food-backend.tar