name: Backend CI

on:
  push:
    branches:
      - main
      - ci-cd/day3-ci
      - ci-cd/day4-artifacts

  pull_request:
    branches:
      - main

jobs:
  backend-ci:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
      
      - name: Run lint
        run: npm run lint

      - name: Run tests 
        run: npm test

      - name: Build Docker image
        run: docker build -t food-backend:ci -f backend/Dockerfile .
        working-directory: .

      - name: Create Docker image archive
        run: docker save food-backend:ci -o backend/food-backend.tar
        working-directory: .

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: food-backend-image
          path: backend/food-backend.tar