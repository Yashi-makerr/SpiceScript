
name: Backend CI

on:
  push:
    branches:
      - main
      - ci-cd/day3-ci
      - ci-cd/day4-artifacts

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/ci-cd/day4-artifacts'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::889629667573:role/GitHubActionsECRPushRole
          aws-region: us-east-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/ci-cd/day4-artifacts'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/ci-cd/day4-artifacts'
        working-directory: .
        env:
          ECR_REGISTRY: 889629667573.dkr.ecr.us-east-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f backend/Dockerfile \
            -t "$ECR_REGISTRY/food-backend:$IMAGE_TAG" .

      - name: Push Docker image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/ci-cd/day4-artifacts'
        working-directory: .
        env:
          ECR_REGISTRY: 889629667573.dkr.ecr.us-east-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$ECR_REGISTRY/food-backend:$IMAGE_TAG"

      - name: Deploy to EC2 through SSM
        if: github.event_name == 'push' && github.ref == 'refs/heads/ci-cd/day4-artifacts'
        shell: bash
        env:
          AWS_REGION: us-east-1
          ECR_REGISTRY: 889629667573.dkr.ecr.us-east-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
          EC2_INSTANCE_ID: i-0d98d1dc1e5d5e6d3
        working-directory: .
        run: |
          set -euo pipefail

          # Build a remote script with the exact image tag.
          REMOTE_SCRIPT=$(cat <<'SCRIPT'
          set -eu

          IMAGE_URI="889629667573.dkr.ecr.us-east-1.amazonaws.com/food-backend:IMAGE_TAG_PLACEHOLDER"
          ENV_FILE="/opt/food-backend/app.env"
          CONTAINER_NAME="food-backend"

          # Check prerequisites before changing the current deployment.
          test -s "$ENV_FILE"
          command -v aws >/dev/null
          command -v docker >/dev/null
          command -v curl >/dev/null

          # Capture the current image for rollback.
          PREVIOUS_IMAGE=""
          if sudo docker inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
            PREVIOUS_IMAGE=$(sudo docker inspect \
              --format='{{.Config.Image}}' "$CONTAINER_NAME")
          fi

          # Authenticate and pull the new image before stopping the old one.
          aws ecr get-login-password --region us-east-1 \
            | sudo docker login \
                --username AWS \
                --password-stdin \
                889629667573.dkr.ecr.us-east-1.amazonaws.com

          sudo docker pull "$IMAGE_URI"

          # Replace the old container.
          sudo docker rm -f "$CONTAINER_NAME" || true

          if sudo docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p 80:5000 \
            --env-file "$ENV_FILE" \
            "$IMAGE_URI"; then
            echo "New container started."
          else
            echo "New container failed to start."
          fi

          # Check HTTP responsiveness for up to 60 seconds.
          for attempt in $(seq 1 12); do
            if curl -fsS http://localhost/ >/dev/null; then
              echo "Deployment health check passed."
              exit 0
            fi
            sleep 5
          done

          echo "New deployment failed its health check."
          sudo docker logs --tail 100 "$CONTAINER_NAME" || true

          # Roll back to the previously deployed image.
          if [ -n "$PREVIOUS_IMAGE" ]; then
            echo "Rolling back to $PREVIOUS_IMAGE"

            sudo docker rm -f "$CONTAINER_NAME" || true

            if sudo docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p 80:5000 \
              --env-file "$ENV_FILE" \
              "$PREVIOUS_IMAGE"; then

              for attempt in $(seq 1 12); do
                if curl -fsS http://localhost/ >/dev/null; then
                  echo "Rollback succeeded; new deployment failed."
                  exit 1
                fi
                sleep 5
              done
            fi

            echo "Rollback did not pass the health check."
          else
            echo "No previous image was recorded; rollback unavailable."
          fi

          exit 1
          SCRIPT
          )

          REMOTE_SCRIPT="${REMOTE_SCRIPT//IMAGE_TAG_PLACEHOLDER/$IMAGE_TAG}"

          PARAMETERS=$(jq -n --arg script "$REMOTE_SCRIPT" \
            '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy SpiceScript image $IMAGE_TAG" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          # Poll for the actual remote command result.
          for attempt in $(seq 1 36); do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}" \
                  --output json
                exit 0
                ;;
              Failed|TimedOut|Cancelled|Cancelling)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for the SSM deployment result."
          exit 1
