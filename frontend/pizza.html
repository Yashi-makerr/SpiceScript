<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artisan Pizzas - SpiceScript</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="subpage-body">

  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html#section-1" class="navbar-link">
      <i class="fas fa-home"></i>
      <span>Home</span>
    </a>
    <a href="index.html#section-2" class="navbar-link">
      <i class="fas fa-utensils"></i>
      <span>Meals</span>
    </a>
    <a href="burger.html" class="navbar-link">
      <i class="fas fa-hamburger"></i>
      <span>Burger</span>
    </a>
    <a href="pizza.html" class="navbar-link active">
      <i class="fas fa-pizza-slice"></i>
      <span>Pizza</span>
    </a>
    <a href="index.html#section-4" class="navbar-link">
      <i class="fas fa-blender-phone"></i>
      <span>Contact</span>
    </a>
  </nav>

  <!-- Hamburger Menu Icon -->
  <div class="menu"></div>

  <!-- Page Banner -->
  <header class="subpage-banner" style="background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('images/gallery-img-5.jpg') center/cover;">
    <h1 class="subpage-title">Artisan Pizzas</h1>
    <p class="subpage-subtitle">Stone-baked pizzas customizable with fresh toppings & hand-tossed crusts</p>
  </header>

  <!-- Pizza Cards Section -->
  <section class="section-2" id="pizza-menu-section" style="background-color: #111;">
    <h3 class="section-heading">Pizza Selections</h3>
    <div class="cards-container" id="menu-cards-container">
      <!-- Pizzas loaded dynamically from backend -->
    </div>
  </section>

  <!-- Floating Cart Button -->
  <div class="floating-cart-btn" id="floatingCart">
    <i class="fas fa-shopping-basket"></i>
    <span class="cart-count-badge" id="cartBadge">0</span>
  </div>

  <!-- Customization Modal Overlay -->
  <div class="modal-overlay" id="customizeModal">
    <div class="modal-content customize-modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="customizeItemName">Customize Pizza</h3>
        <button type="button" class="close-modal-icon" id="closeCustomizeBtn"><i class="fas fa-times"></i></button>
      </div>

      <div class="modal-body">
        <!-- Bread/Crust Selection -->
        <div class="custom-option-group">
          <h4 class="option-group-title">Choose Pizza Crust</h4>
          <div class="option-choices" id="breadChoices">
            <label class="choice-card active">
              <input type="radio" name="crustSelection" value="Thick Crust" checked />
              <span class="choice-details">
                <span class="choice-title">Thick Crust</span>
                <span class="choice-price">+₹0</span>
              </span>
            </label>
            <label class="choice-card">
              <input type="radio" name="crustSelection" value="Thin Crust" />
              <span class="choice-details">
                <span class="choice-title">Thin Crust (Flat)</span>
                <span class="choice-price">+₹20</span>
              </span>
            </label>
            <label class="choice-card">
              <input type="radio" name="crustSelection" value="Cheese-Burst" />
              <span class="choice-details">
                <span class="choice-title">Cheese-Burst</span>
                <span class="choice-price">+₹50</span>
              </span>
            </label>
          </div>
        </div>

        <!-- Toppings Selection -->
        <div class="custom-option-group">
          <h4 class="option-group-title">Select Premium Toppings</h4>
          <div class="toppings-list">
            <label class="topping-item">
              <input type="checkbox" name="toppingSelection" value="Extra Mozzarella" data-price="40" />
              <span class="topping-name">Extra Mozzarella Cheese</span>
              <span class="topping-price">+₹40</span>
            </label>
            <label class="topping-item">
              <input type="checkbox" name="toppingSelection" value="Fresh Mushrooms" data-price="30" />
              <span class="topping-name">Fresh Sliced Mushrooms</span>
              <span class="topping-price">+₹30</span>
            </label>
            <label class="topping-item">
              <input type="checkbox" name="toppingSelection" value="Italian Pepperoni" data-price="60" />
              <span class="topping-name">Italian Pepperoni</span>
              <span class="topping-price">+₹60</span>
            </label>
            <label class="topping-item">
              <input type="checkbox" name="toppingSelection" value="Olives & Jalapenos" data-price="25" />
              <span class="topping-name">Black Olives & Jalapenos</span>
              <span class="topping-price">+₹25</span>
            </label>
          </div>
        </div>
      </div>

      <div class="modal-footer customize-footer">
        <div class="price-display-wrapper">
          <span class="price-label">Adjusted Price:</span>
          <span class="price-amount" id="customizedPrice">₹0.00</span>
        </div>
        <button type="button" class="confirm-add-btn" id="confirmAddCartBtn">Confirm & Add</button>
      </div>
    </div>
  </div>

  <script src="subpage.js"></script>
</body>
</html>
